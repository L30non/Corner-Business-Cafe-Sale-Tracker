{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="error-page">
    <h1 style="font-size: 4rem; margin-bottom: 1rem;">500</h1>
    <h2>Internal Server Error</h2>
    <p>Something went wrong on our end. Please try again later.</p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary" style="margin-top: 1.5rem;">Go to Dashboard</a>
</div>

<style>
.error-page {
    text-align: center;
    padding: 4rem 2rem;
    max-width: 600px;
    margin: 0 auto;
}
</style>
{% endblock %}
